name: CI - Integración Continua (Backend & Frontend)

on:
  push:
    branches: [ develop, Master ]
  pull_request:
    branches: [ develop, Master ]

jobs:
  tests:
    name: Ejecutar Suite de Tests (Backend)
    runs-on: ubuntu-latest

    # Levantar un contenedor de PostgreSQL aislado en GitHub Actions
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testing_db
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: secret_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP y extensiones
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, pdo, pdo_pgsql, pgsql, bcmath, sqlite3, pdo_sqlite
          coverage: none

      - name: Instalar dependencias de Composer
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Preparar entorno de pruebas
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ejecutar migraciones en PostgreSQL de prueba
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing_db
          DB_USERNAME: runner
          DB_PASSWORD: secret_password
        run: php artisan migrate --force

      - name: Ejecutar suite de pruebas de Laravel
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing_db
          DB_USERNAME: runner
          DB_PASSWORD: secret_password
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: php artisan test

  # Compilacion del frontend
  frontend:
    name: Compilación Frontend (Vite & Tailwind)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Compilar Frontend con Vite
        run: npm run build

  # Linter y formato de código PHP
  lint:
    name: Verificación de Estilo (Laravel Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Instalar dependencias de Composer
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Validar estilo de código con Laravel Pint
        run: vendor/bin/pint --test

  # Auditoría de seguridad de dependencias
  security:
    name: Auditoría de Seguridad (Dependencias)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Auditoría de paquetes PHP (Composer Audit)
        run: composer audit --locked

      - name: Auditoría de paquetes JS (NPM Audit)
        run: npm audit --audit-level=high
